name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write   # needed only to attach the .vsix to GitHub Releases on tags

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx vsce package --no-dependencies
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: '*.vsix'
      # On a version tag (e.g. v0.2.0), publish the .vsix as a GitHub Release asset,
      # with only that version's CHANGELOG section as notes (fails if it is missing).
      - if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" '/^## /{p = ($2 == v)} p && !/^## /' CHANGELOG.md > release-notes.md
          grep -q . release-notes.md || { echo "::error::No CHANGELOG section for ${GITHUB_REF_NAME#v}"; exit 1; }
          gh release create "$GITHUB_REF_NAME" *.vsix --title "$GITHUB_REF_NAME" --notes-file release-notes.md
